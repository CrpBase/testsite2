<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenes</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  .frame {
    position: fixed;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .frame.active { opacity: 1; }

  #segs {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 6px;
  }
  .seg {
    width: 36px; height: 2px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .seg.active { background: #fff; }
  .seg.done   { background: rgba(255,255,255,0.6); }

  #ctr {
    position: fixed;
    right: 28px; bottom: 22px;
    z-index: 20;
    color: rgba(255,255,255,0.3);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
  }

  #hint {
    position: fixed;
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-family: sans-serif;
    white-space: nowrap;
    transition: opacity 1s;
  }
  #hint.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="frame active" style="background-image: url('f1.jpg')"></div>
<div class="frame"        style="background-image: url('f2.jpg')"></div>
<div class="frame"        style="background-image: url('f3.jpg')"></div>
<div class="frame"        style="background-image: url('f4.jpg')"></div>
<div class="frame"        style="background-image: url('f5.jpg')"></div>
<div class="frame"        style="background-image: url('f6.jpg')"></div>
<div class="frame"        style="background-image: url('f7.jpg')"></div>
<div class="frame"        style="background-image: url('f8.jpg')"></div>

<div id="segs"></div>
<div id="ctr">01 / 08</div>
<div id="hint">scroll to explore</div>

<script>
  const frames = Array.from(document.querySelectorAll('.frame'));
  const segsEl = document.getElementById('segs');
  const ctr    = document.getElementById('ctr');
  const hint   = document.getElementById('hint');
  const TOTAL  = frames.length;

  let cur  = 0;
  let busy = false;

  // segments
  for (let i = 0; i < TOTAL; i++) {
    const s = document.createElement('div');
    s.className = 'seg' + (i === 0 ? ' active' : '');
    s.addEventListener('click', () => goTo(i));
    segsEl.appendChild(s);
  }
  const segs = Array.from(segsEl.querySelectorAll('.seg'));

  function updateUI() {
    ctr.textContent = String(cur+1).padStart(2,'0') + ' / ' + String(TOTAL).padStart(2,'0');
    segs.forEach((s,i) => {
      s.classList.toggle('active', i === cur);
      s.classList.toggle('done',   i < cur);
    });
  }

  function goTo(idx) {
    if (idx === cur || busy || idx < 0 || idx >= TOTAL) return;
    busy = true;
    hint.classList.add('hidden');

    frames[cur].classList.remove('active');
    cur = idx;
    frames[cur].classList.add('active');

    updateUI();
    setTimeout(() => { busy = false; }, 550);
  }

  // wheel
  let wBuf = 0, wTm;
  window.addEventListener('wheel', e => {
    e.preventDefault();
    if (busy) return;
    wBuf += e.deltaY;
    clearTimeout(wTm);
    wTm = setTimeout(() => { wBuf = 0; }, 300);
    if      (wBuf >=  50) { wBuf = 0; goTo(cur + 1); }
    else if (wBuf <= -50) { wBuf = 0; goTo(cur - 1); }
  }, { passive: false });

  // touch
  let ty0 = null;
  window.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchend',   e => {
    if (!ty0) return;
    const dy = ty0 - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 40) goTo(cur + (dy > 0 ? 1 : -1));
    ty0 = null;
  }, { passive: true });

  // keyboard
  window.addEventListener('keydown', e => {
    if (e.key==='ArrowDown'||e.key==='ArrowRight') goTo(cur+1);
    if (e.key==='ArrowUp'  ||e.key==='ArrowLeft')  goTo(cur-1);
  });
</script>
</body>
</html>
